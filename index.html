<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Closet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="closet-app" content="5">
<meta name="apple-mobile-web-app-title" content="My Closet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#DCE7DD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#223029" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#F3F2EC; --surface:#FCFBF6; --ink:#22302A; --muted:#5E6A61; --line:#DAD9CD;
  --accent:#3E6B52; --accent-ink:#FFFFFF; --tag:#F1E2A8; --tag-ink:#5A4708; --sheet:#F7F5EC;
  --err-bg:#F6DDD6; --err-ink:#7A2A1C; --band:#DCE7DD; --bar:#3E6B52; --bar-ink:#E9E3CC;
  --font:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A16; --surface:#1D2520; --ink:#E9EDE6; --muted:#A3AEA5; --line:#2E3A33;
    --accent:#8FB39A; --accent-ink:#141A16; --tag:#4A3F18; --tag-ink:#F1E2A8; --sheet:#232C26;
    --err-bg:#4A2620; --err-ink:#F6DDD6; --band:#223029; --bar:#223029; --bar-ink:#C9D8CD;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A16; --surface:#1D2520; --ink:#E9EDE6; --muted:#A3AEA5; --line:#2E3A33;
    --accent:#8FB39A; --accent-ink:#141A16; --tag:#4A3F18; --tag-ink:#F1E2A8; --sheet:#232C26;
    --err-bg:#4A2620; --err-ink:#F6DDD6; --band:#223029; --bar:#223029; --bar-ink:#C9D8CD;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;font-size:36px;line-height:1.05;font-weight:600;letter-spacing:-.015em;margin:0}
h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:28px 0 10px}
h3{font-size:17px;font-weight:600;margin:0 0 10px}
p{margin:0}
.sub{color:var(--muted);margin-top:4px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.actions{display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px;min-height:44px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:none;color:var(--muted);padding:11px 8px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:6px 0 0}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:block;margin-top:18px}
.field > span{display:block;font-size:14px;color:var(--muted);font-weight:500}

.banner{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;background:var(--tag);color:var(--tag-ink);border-radius:12px;font-weight:500}
.banner .btn{background:var(--tag-ink);color:var(--tag);min-height:40px;padding:8px 14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px;margin-top:18px}
.item{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;align-items:flex-start;min-width:0;position:relative;width:100%}
.item .ph{width:100%;aspect-ratio:1;background:var(--surface);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item.sel .ph{outline:3px solid var(--accent);outline-offset:2px}
.item .check{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:700}
.item.sel .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hangtag{position:relative;margin-top:-10px;margin-left:10px;max-width:calc(100% - 16px);display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;background:var(--surface);border:1px solid var(--line);border-radius:3px 12px 12px 3px;font-size:13.5px;font-weight:500;box-shadow:0 1px 0 var(--line);transform:rotate(-2deg)}
.hangtag::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted)}
.hangtag b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hangtag.neg{background:var(--tag);color:var(--tag-ink);border-color:transparent}
.hangtag.neg::before{border-color:var(--tag-ink)}
.hangtag.pending{color:var(--muted);font-style:italic}
.meta{font-size:12.5px;color:var(--muted);margin:6px 0 0 12px}

.empty{margin-top:28px;padding:22px;border:1.5px dashed var(--line);border-radius:14px;max-width:520px}
.empty h3{margin-bottom:6px}
.empty p + p{margin-top:8px}
.note{margin-top:14px;font-size:14px;color:var(--muted)}
.err{margin-top:14px;color:var(--err-ink);background:var(--err-bg);padding:10px 12px;border-radius:8px;font-size:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.lay{background:var(--sheet);border-radius:8px;padding:12px}
.lay .main{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lay .main.n1{grid-template-columns:minmax(0,60%)}
.lay .extra{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.lay figure{margin:0;min-width:0}
.lay img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--surface)}
.lay figcaption{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lay.sm{padding:8px}
.lay.sm figcaption{display:none}
.lay.sm .main{gap:6px}.lay.sm .extra{gap:6px;margin-top:6px;grid-template-columns:repeat(5,1fr)}
.why{margin-top:12px;font-size:15.5px;line-height:1.5;max-width:62ch}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.row .btn{padding:9px 14px;min-height:40px;font-size:15px}
.anchor{display:inline-flex;align-items:center;gap:10px;margin-top:6px;padding:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.anchor img{width:40px;height:40px;object-fit:cover;border-radius:6px}
.anchor button{border:0;background:none;color:var(--muted);padding:6px 8px;font-size:14px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:15.5px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

.hist{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist .d{width:84px;flex:none;font-size:14px;color:var(--muted)}
.hist .t{display:flex;gap:6px;overflow-x:auto}
.hist img{width:44px;height:44px;object-fit:cover;border-radius:5px;flex:none}
.backup{margin-top:36px;padding-top:6px;border-top:1px solid var(--line)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;max-width:220px;background:none;border:0;padding:12px 8px 14px;font-size:15px;color:var(--muted);font-weight:500;position:relative}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabs button[aria-current="page"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:736px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;z-index:6;flex-wrap:wrap}
.selbar span{flex:1;font-weight:600;min-width:90px}
.selbar .btn{background:var(--bg);color:var(--ink);min-height:40px;padding:8px 12px;font-size:15px}
.selbar .btn.quiet{background:none;color:var(--bg);opacity:.8}

dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100% - 24px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(10,12,18,.55)}
.dlg{padding:18px;overflow-y:auto}
.dlg .ph{width:100%;max-height:260px;object-fit:contain;border-radius:8px;background:var(--sheet)}
.dlg .count{font-size:14px;color:var(--muted);margin-bottom:10px}
.dlg input[type=text],.dlg select{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
.dlg .stats{margin-top:12px;color:var(--muted);font-size:15px}
.dlg .row{justify-content:space-between}
.danger{color:#B3261E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .danger{color:#F2B8B5}}
:root[data-theme="dark"] .danger{color:#F2B8B5}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:10;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.loading{padding:60px 0;color:var(--muted)}

.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.sw.multi{background:conic-gradient(#e53935,#fbc02d,#43a047,#1e88e5,#8e24aa,#e53935)}
.chip{display:inline-flex;align-items:center;gap:7px}
.sec{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.sec > h4{margin:0;font-size:15px;font-weight:600}
.sec > p.hint{font-size:13.5px;color:var(--muted);margin-top:2px}
.req{color:var(--accent);font-weight:600}
textarea{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:96px;font:inherit;color:inherit;resize:vertical}
.stepper{display:inline-flex;align-items:center;gap:0;margin-top:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--bg);width:44px;height:40px;font-size:20px}
.stepper span{min-width:44px;text-align:center;font-weight:600}
.seg{display:inline-flex;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:8px;font-weight:500;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.msg{margin-top:16px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user p{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px 14px 4px 14px;max-width:85%}
.msg.ai > p{background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:14px 14px 14px 4px;max-width:92%}
.ask{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:12px 0 4px;margin-top:12px}
.ask textarea{min-height:64px;margin:0}
.keybox input{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
.tips{margin:8px 0 0;padding-left:18px;font-size:14.5px;color:var(--muted)}
.tips li + li{margin-top:3px}
.status{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--bg);position:absolute;top:8px;left:8px}
.item.off .ph img{opacity:.45}
.fc{margin-top:8px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:15px}
.fc .chips{margin-bottom:8px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;font-size:inherit}
.chip[aria-pressed="mixed"]{border-style:dashed;border-color:var(--ink)}
.chip small{color:var(--muted);font-size:12px}
.hint-inline{font-weight:400;font-size:13px}
.qty{font-weight:600;color:var(--muted);margin-left:2px}
.tabs button{font-size:14px;padding-left:4px;padding-right:4px}
.tools{display:flex;gap:8px;margin-top:16px;align-items:flex-end}
.tools input[type=search],.tools select,.datein{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px;font:inherit;color:inherit}
.tools select{flex:0 0 auto;max-width:44%}
.datein{width:100%;margin-top:6px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.dayhead h3{margin:0}.dayhead .note{margin:0;text-align:right}
.tripcard{display:block;width:100%;text-align:left;color:inherit;font:inherit}
.tripcard h3{margin:0}
.tripfit{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tripfit .label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.packcat{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 4px}
.packrow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:inherit;font:inherit}
.packrow img{width:44px;height:44px;object-fit:cover;border-radius:6px;flex:none}
.packrow .box{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700}
.packrow.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.packrow.on .nm{color:var(--muted);text-decoration:line-through}
.packrow .nm{display:flex;flex-direction:column;min-width:0}
.packrow small{color:var(--muted);font-size:13px;text-decoration:none}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em}
.stoprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.stoprow span{display:flex;flex-direction:column}.stoprow small{color:var(--muted);font-size:13px}
.stat span{font-size:13px;color:var(--muted)}

html{background:var(--band)}
body{background:var(--bg);min-height:100%;overflow-x:hidden}
.band{background:var(--band);margin:-26px calc(50% - 50vw) 0;padding:26px calc(50vw - 50%) 20px}
.band .tools{margin-top:16px}
main{padding-top:26px}
.tabs{background:var(--bar);border-top:0}
.tabs button{color:var(--bar-ink)}
.tabs button[aria-current="page"]{color:var(--tag-ink)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;inset:6px 8px auto 8px;top:6px;bottom:auto;height:calc(100% - 12px);left:8px;right:8px;border-radius:12px;background:var(--tag);z-index:-1}
.tabs button{isolation:isolate}
.chip{background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:var(--surface)}
.hangtag{background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.banner{background:var(--tag);color:var(--tag-ink)}
.lay{background:var(--sheet)}
.item .ph{background:var(--surface)}
.brand{display:flex;align-items:center;gap:12px;text-transform:lowercase;font-size:36px;letter-spacing:.01em}
.brand .logo{width:38px;height:38px;border-radius:10px;flex:none}
.figbtn{border:0;background:none;padding:0;margin:0;min-width:0;text-align:left;position:relative;cursor:pointer;color:inherit;font:inherit;display:block}
.figbtn img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--surface)}
.figbtn figcaption{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lay.sm .figbtn figcaption{display:none}
.swapdot{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;display:grid;place-items:center;opacity:.9}
.addslot{display:grid;place-items:center;aspect-ratio:1;border:1.5px dashed var(--line);border-radius:4px;color:var(--muted);font-size:26px;background:var(--surface)}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px;margin-top:14px}
.slotpick{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px;text-align:center;cursor:pointer;color:inherit;font:inherit}
.slotpick img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.slotpick span{font-size:12.5px;line-height:1.2;display:flex;flex-direction:column}
.editedtag{font-size:11px;font-weight:600;color:var(--tag-ink);background:var(--tag);padding:1px 7px;border-radius:999px;margin-left:4px}
.slotpick small{color:var(--tag-ink);font-size:11px}
</style>
</head>
<body>
<main id="app"><p class="loading">Opening your closet…</p></main>
<div id="selbar"></div>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-tab="closet">Closet</button>
  <button data-tab="ideas">Ideas</button>
  <button data-tab="plan">Plan</button>
  <button data-tab="outfits">Outfits</button>
  <button data-tab="stats">Stats</button>
</nav>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="restore" accept="application/json,.json" hidden>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= constants ================= */
const CATS=["Top","Bottom","Dress","Outerwear","Shoes","Legwear","Underlayer","Swimwear","Sleepwear","Bag","Accessory"];
const TYPES={
  Top:["T-shirt / top","Tank / cami","Shirt / blouse","Knit / sweater","Sweater vest","Bodysuit","Sports top","Other"],
  Bottom:["Trousers","Jeans","Skirt","Shorts","Leggings","Other"],
  Dress:["Dress","Jumpsuit"],
  Outerwear:["Cardigan","Blazer","Gilet","Jacket","Trench","Coat","Puffer"],
  Shoes:["Sneakers","Flats","Loafers","Boots","Heels","Sandals","Other"],
  Legwear:["Tights","Socks"],
  Underlayer:["Slip","Bike shorts","Bodysuit","Bralette","Camisole"],
  Bag:["Handbag","Crossbody","Clutch","Tote","Backpack"],
  Accessory:["Jewellery","Belt","Scarf","Hat","Sunglasses","Other"],
  Swimwear:["Swimsuit","Bikini","Swim shorts","Cover-up"],
  Sleepwear:["Pyjamas","Nightdress","Lounge set"]
};
const MID=new Set(["Cardigan","Blazer","Gilet"]);
const OCCASIONS=["Office","Casual","Going out","Elegant","Travel","Business travel","Holiday","Beach","Sport"];
const WEATHER=["Hot","Warm","Mild","Cool","Cold"];
const SEASONS=["Spring","Summer","Autumn","Winter"];
const WEATHER_SEASON={Hot:["Summer"],Warm:["Summer","Spring"],Mild:["Spring","Autumn"],Cool:["Autumn","Winter"],Cold:["Winter"]};
const WARMTH=["Very light","Light","Medium","Warm"];

/* ================= storage (IndexedDB, this device) ================= */
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{
    const r=indexedDB.open("closet",3);
    r.onupgradeneeded=()=>{const d=r.result;for(const k of KINDS)if(!d.objectStoreNames.contains(k))d.createObjectStore(k,{keyPath:"id"})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error);
  })},
  all(k){return new Promise((res,rej)=>{const q=this.db.transaction(k).objectStore(k).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  tx(k,fn){return new Promise((res,rej)=>{const t=this.db.transaction(k,"readwrite");fn(t.objectStore(k));t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
};
const Store={
  async load(){await DB.open();for(const k of KINDS){const rows=await DB.all(k);S[k]=new Map(rows.map(r=>[r.id,r]))}await migrate()},
  async put(kind,id,data){
    const row={...data,id};
    try{await DB.tx(kind,s=>s.put(row));S[kind].set(id,row)}
    catch(e){toast("Your phone is out of storage for this app. Free up space and try again.");throw e}
  },
  async remove(kind,id){await DB.tx(kind,s=>s.delete(id)).catch(()=>{});S[kind].delete(id)}
};
async function migrate(){
  for(const it of S.items.values()){
    if(it.type==="T-shirt"){await Store.put("items",it.id,{...it,type:"T-shirt / top"})}
  }
  for(const t of S.trips.values()){
    if(t.stops)continue;
    const stop={name:t.name,label:t.place||t.name,lat:t.lat,lon:t.lon,from:t.start,to:t.end,fc:t.fc?{...t.fc,kind:"forecast"}:null};
    const n={...t,stops:[stop],days:(t.days||[]).map(d=>({...d,stop:0,travel:null,laundry:false})),built:!!Object.keys(t.outfits||{}).length,checks:t.checks||{}};
    delete n.fc;delete n.place;delete n.lat;delete n.lon;
    await Store.put("trips",n.id,n);
  }
  // backfill per-copy laundry for every item, including already-migrated ones
  for(const it of S.items.values()){
    if(it.inWash==null){const v=(it.status==="In laundry")?(it.qty||1):0;await Store.put("items",it.id,{...it,inWash:v})}
  }
  for(const it of S.items.values()){
    if(it.v===3)continue;
    const n={...it};
    if(n.v!==2){
      n.qty=n.qty||1;n.status=n.status||"In closet";
      if(n.color==="Print"){n.color="Multicolour";n.pattern=n.pattern||"Abstract print"}
      if(n.color==="Metallic")n.color="Silver";
      if(!n.needsTags){
        const s=it.season||[];
        if(n.warmth==null)n.warmth=(s.includes("Cold")&&!s.includes("Warm"))?3:(s.length===1&&s[0]==="Warm")?1:2;
        n.needsReview=true;
      }
      n.season=[];
    }
    for(const k of ["material","pattern","closure"])if(n[k]!=null&&!Array.isArray(n[k]))n[k]=n[k]?[n[k]]:[];
    if(n.type==="T-shirt")n.type="T-shirt / top";
    if(n.inWash==null)n.inWash=(n.status==="In laundry")?(n.qty||1):0;
    if("color2" in n){n.colors2=arr(n.colors2).length?n.colors2:(n.color2?[n.color2]:[]);delete n.color2}
    n.v=3;
    await Store.put("items",n.id,n);
  }
}

function wearStats(){
  const m=new Map();
  for(const e of S.log.values())for(const id of e.itemIds||[]){
    const w=m.get(id)||{count:0,last:null};w.count++;if(!w.last||e.date>w.last)w.last=e.date;m.set(id,w);
  }
  return m;
}
function daysSince(it,w){const ref=w&&w.last?dayMs(w.last):(it.addedAt||Date.now());return Math.floor((Date.now()-ref)/864e5)}
function isNeglected(it,w){return !it.needsTags&&daysSince(it,w)>=NEGLECT_DAYS}
function ago(date){if(!date)return "never";const d=Math.round((dayMs(today())-dayMs(date))/864e5);return d<=0?"today":d===1?"yesterday":d+" days ago"}
function items(){return [...S.items.values()]}
const qtyOf=it=>Math.max(1,it.qty||1);
const inWash=it=>Math.min(qtyOf(it),Math.max(0,it.inWash||0));
const cleanCount=it=>it.status==="At tailor"?0:qtyOf(it)-inWash(it);
const available=it=>it.status!=="At tailor"&&cleanCount(it)>0;
function wearsSince(it){const since=it.washedAt||"";let n=0;for(const e of S.log.values())if(e.date>since&&(e.itemIds||[]).includes(it.id))n++;return n}
function dueForWash(it){if(!it||it.needsTags||it.status==="At tailor")return false;const lim=wearLimit(it);if(!isFinite(lim))return false;
  // the set is due when every clean copy has reached its wear limit
  return cleanCount(it)>0&&wearsSince(it)>=lim*qtyOf(it);}
function laundryLabel(it){const w=inWash(it),q=qtyOf(it);if(it.status==="At tailor")return "At tailor";if(w<=0)return "";return q>1?`${w} of ${q} in wash`:"In laundry";}
async function moveToWash(it,n){const q=qtyOf(it);const cur=inWash(it);const next=Math.max(0,Math.min(q,cur+n));
  const patch={...it,inWash:next};if(next<cur)patch.washedAt=today();
  // keep legacy status roughly in sync for display elsewhere
  patch.status=next>=q?"In laundry":"In closet";if(it.status==="At tailor"&&n===0)patch.status="At tailor";
  await Store.put("items",it.id,patch);return patch;}
const fmtLim=n=>isFinite(n)?String(n):"no limit";
const W=it=>it.warmth==null?2:+it.warmth;
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);

function missingDetails(it){
  if(it.needsTags)return false;
  if(it.needsReview)return true;
  if(it.category==="Top"||it.category==="Dress")return !it.sleeves||!it.fit;

function readAsDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function resizeImage(file,max=480,q=0.72){
  const src=await readAsDataURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
  const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
  return c.toDataURL("image/jpeg",q);
}
async function addFiles(files){
  if(!files.length)return;
  toast(files.length===1?"Adding 1 piece…":`Adding ${files.length} pieces…`);
  let n=0;
  for(const f of files){
    try{
      const photo=await resizeImage(f);const id=rid();
      await Store.put("items",id,{v:3,name:"",brand:"",category:"",type:"",color:"",formality:[],season:[],qty:1,status:"In closet",photo,addedAt:Date.now()+n,needsTags:true});
      n++;
    }catch(e){toast("One photo couldn't be read. Try a JPEG or PNG.")}
  }
  render();
  if(n)startQueue("tag");
}
function startQueue(kind){
  const list=kind==="tag"?items().filter(i=>i.needsTags):items().filter(missingDetails);
  ui.queue=list.sort((a,b)=>(a.addedAt||0)-(b.addedAt||0)).map(i=>i.id);
  ui.queueLabel=kind==="tag"?"Tagging":"Reviewing";
  if(ui.queue.length)openItem(ui.queue[0],true);
}

const FC={data:null,at:0,status:"idle"};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

async function loadForecast(force){

  if(!force&&FC.data&&Date.now()-FC.at<36e5){applyForecast();return}
  if(!navigator.onLine){if(!FC.data)FC.status="offline";applyForecast();render();return}

  try{
    const c=await getPos();lsSet("closet-home",JSON.stringify({lat:c.latitude,lon:c.longitude}));
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude.toFixed(3)}&longitude=${c.longitude.toFixed(3)}&hourly=apparent_temperature,precipitation_probability&timezone=auto&forecast_days=7`;

function dateForOffset(n){const d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
function forecastFor(data,key){
  if(!data||!data.time)return null;
  if(data.shift)key=(+key.slice(0,4)-data.shift)+key.slice(4);
  const idx=[];data.time.forEach((t,i)=>{const h=+t.slice(11,13);if(t.startsWith(key)&&h>=8&&h<=19)idx.push(i)});

- Mild, cool or cold weather: straps, strapless, sleeveless or short sleeves always get a layer (a top underneath or a cardigan/blazer over). Cool and cold: a first layer where arms are bare, plus a jacket or coat on top.
- Proportions: cropped pairs with high waists, oversized balances slim. Usually one pattern per outfit.
- Colour: favour proven pairings (navy + camel, olive + rust, burgundy + blush), tonal looks, and one accent against neutrals. Name the colour idea briefly in "why".
- Prefer combinations not in the saved, recently worn or rejected lists, and pieces not worn lately, unless the owner asks otherwise.
- If key context is missing (weather, dress code), assume sensibly and say so in one short phrase.
Reply with ONLY a JSON object, no markdown: {"reply":"1-3 conversational sentences","outfits":[{"title":"2-5 words","itemIds":["id","id"],"why":"max 40 words of concrete styling reasoning plus one practical tip"}]}
Give 1-3 outfits unless asked for more. If nothing fits, return "outfits": [] and explain in reply.

Wardrobe (id | name | details):
${closetForAI()}

Saved outfits:
${list([...S.outfits.values()].map(o=>o.itemIds))}
Worn in the last 14 days:
${list([...S.log.values()].filter(e=>dayMs(e.date)>=cut).map(e=>e.itemIds||[]))}
Rejected:
${list([...S.passes.values()].map(p=>p.itemIds))}`;
}
function parseAI(text){
  const a=text.indexOf("{"),b=text.lastIndexOf("}");
  const o=JSON.parse(text.slice(a,b+1));
  const outfits=(o.outfits||[]).map(x=>({title:String(x.title||"Outfit").slice(0,52),itemIds:[...new Set((x.itemIds||[]).map(String).filter(id=>S.items.has(id)))],why:String(x.why||"").slice(0,400),tips:[],saved:false})).filter(x=>x.itemIds.length>=2);
  return {reply:String(o.reply||""),outfits};
}
async function askAI(text){
  const key=lsGet("closet-api-key");if(!key||ui.asking)return;
  ui.chat.push({role:"user",text});ui.asking=true;ui.askErr="";ui.ctl=new AbortController();render();
  const messages=ui.chat.filter(m=>m.role==="user"||m.raw).map(m=>({role:m.role==="user"?"user":"assistant",content:m.role==="user"?m.text:m.raw}));
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:ui.ctl.signal,headers:{
      "content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:lsGet("closet-model")||DEFAULT_MODEL,max_tokens:1500,system:aiSystem(),messages})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){
      const m=(data.error&&data.error.message)||"";
      throw new Error(res.status===401?"The API key was rejected. Check it under Change key.":/credit/i.test(m)?"Your API credit has run out. Top up at console.anthropic.com.":res.status===429?"Too many requests. Wait a minute and try again.":res.status===404||/model/i.test(m)?"That model name isn't available. Check it under Change key.":m||"The request failed. Try again.");
    }
    const raw=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
    let parsed;try{parsed=parseAI(raw)}catch(e){parsed={reply:raw.slice(0,600),outfits:[]}}
    ui.chat.push({role:"ai",raw,text:parsed.reply,outfits:parsed.outfits});
  }catch(e){
    if(e.name==="AbortError"){ui.chat.pop()}
    else{ui.askErr=navigator.onLine?e.message:"You're offline. Quick ideas still work.";ui.chat.pop()}
  }
  ui.asking=false;render();
  const box=$("#askText");if(box&&ui.askErr)box.value=text;
}

function resultAt(ref){
  if(!ref)return null;const p=ref.split(":");
  if(p[0]==="q")return {list:ui.results,i:+p[1]};
  if(p[0]==="c"){const m=ui.chat[+p[1]];return m?{list:m.outfits,i:+p[2]}:null}
  if(p[0]==="t"){const t=S.trips.get(ui.tripId);const d=p.slice(1,-1).join(":");return t&&t.outfits[d]?{list:t.outfits[d],i:+p[p.length-1],trip:t,date:d}:null}
  if(p[0]==="plan"){const d=p.slice(1).join(":");const pl=S.plans.get(d);return pl?{list:[pl],i:0,plan:d}:null}
  return null;
}

function exportBackup(){
  const o={app:"closet",version:4,exportedAt:new Date().toISOString()};
  for(const k of KINDS)o[k]=[...S[k].values()];
  const json=JSON.stringify(o),name=`closet-backup-${today()}.json`;
  const blob=new Blob([json],{type:"application/json"});
  if(ui.backupUrl)URL.revokeObjectURL(ui.backupUrl.href);
  ui.backupUrl={href:URL.createObjectURL(blob),name};
  const done=()=>{lsSet("closet-last-backup",today());render()};
  const touch=matchMedia("(pointer:coarse)").matches;
  if(touch&&navigator.canShare){
    const file=new File([json],name,{type:"text/plain"});
    if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Closet backup"}).then(done).catch(()=>render());return}
  }
  try{const a=document.createElement("a");a.href=ui.backupUrl.href;a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
  done();
}
async function importBackup(file){
  try{
    const o=JSON.parse(await file.text());if(o.app!=="closet")throw 0;
    let n=0;for(const k of KINDS)for(const row of o[k]||[])if(row&&row.id){await Store.put(k,row.id,row);if(k==="items")n++}
    await migrate();toast(`Restored ${n} pieces`);render();
  }catch(e){toast("That file isn't a Closet backup.")}
}

function renderOutfits(){
  let h=`<h1>Outfits</h1><!--/head-->`+planBanner()+`<h2>Today</h2>`;
  const t=S.log.get(today()),pt=S.plans.get(today());
  h+=t?`<div class="card">${collage(t.itemIds)}</div>`
    :pt?`<div class="card"><h3>Planned for today</h3>${collage(pt.itemIds)}<div class="row"><button class="btn" data-act="p-wear" data-v="${today()}">Wear this</button></div></div>`
    :`<p class="sub">Nothing logged yet. Tap Wear today on an outfit, or select pieces in your closet.</p>`;
  const outs=[...S.outfits.values()].sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
  const worn=new Map();for(const e of S.log.values())if(e.outfitId)worn.set(e.outfitId,(worn.get(e.outfitId)||0)+1);
  h+=`<h2>Saved${outs.length?` (${outs.length})`:""}</h2>`;
  if(!outs.length)h+=`<p class="sub">Outfits you save from Ideas or build in your closet show up here.</p>`;
  outs.forEach(o=>{
    const n=worn.get(o.id)||0;
    h+=`<article class="card"><h3>${esc(o.title)}</h3>${collage(o.itemIds,true)}${o.why?`<p class="why">${esc(o.why)}</p>`:""}<p class="note">${n?`Worn ${n}x`:"Not worn yet"}</p>
    <div class="row">${ui.planDate?`<button class="btn" data-act="o-plan" data-id="${o.id}">Plan for ${esc(dayLabel(ui.planDate))}</button>`:`<button class="btn" data-act="o-wear" data-id="${o.id}">Wear today</button>`}<button class="btn quiet" data-act="o-del" data-id="${o.id}">Remove</button></div></article>`;
  });
  const cutoff=Date.now()-14*864e5;
  const hist=[...S.log.values()].filter(e=>e.date!==today()&&dayMs(e.date)>=cutoff).sort((a,b)=>b.date.localeCompare(a.date));
  if(hist.length){
    h+=`<h2>Last 2 weeks</h2>`;
    hist.forEach(e=>{const d=new Date(dayMs(e.date)).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
      h+=`<div class="hist"><span class="d">${esc(d)}</span><div class="t">${(e.itemIds||[]).map(id=>S.items.get(id)).filter(Boolean).map(i=>`<img src="${i.photo}" alt="${esc(i.name)}">`).join("")}</div></div>`});
  }
  return h;
}

function render(){
  if(!ui.ready)return;

function openItem(id,inQueue){
  const it=S.items.get(id);if(!it)return;
  ui.draft=JSON.parse(JSON.stringify({...it,formality:it.formality||[],season:it.season||[],qty:it.qty||1,status:it.status||"In closet",inWash:it.inWash||0}));
  ui.draftId=id;ui.inQueue=!!inQueue;
  renderSheet();
  if(!$("#dlg").open)$("#dlg").showModal();
  $("#dlgBody").scrollTop=0;
}
function single(field,opts,cur,colors){
  return opts.map(v=>`<button type="button" class="chip" data-f="${field}" data-v="${esc(v)}" aria-pressed="${v===cur}">${colors?swatch(v):""}${esc(v)}</button>`).join("");
}
function multi(field,opts,cur,colors){return opts.map(v=>`<button type="button" class="chip" data-m="${field}" data-v="${esc(v)}" aria-pressed="${arr(cur).includes(v)}">${colors?swatch(v):""}${esc(v)}</button>`).join("")}
function swatch(c){return c==="Multicolour"?`<span class="sw multi"></span>`:`<span class="sw" style="background:${COLOR_HEX[c]}"></span>`}
function laundryControl(d){
  const q=qtyOf(d),w=Math.min(q,Math.max(0,d.inWash||0)),clean=q-w;
  if(d.status==="At tailor")return `<p class="note" style="margin-top:6px">This piece is at the tailor, so it's out of rotation.</p>`;
  if(q===1){
    return `<div class="chips wrap">${["In closet","In laundry"].map(v=>`<button type="button" class="chip" data-wash1="${v}" aria-pressed="${(v==="In laundry")===(w>0)}">${v}</button>`).join("")}</div>`;
  }
  return `<p class="note" style="margin:6px 0 0">${clean} clean, ${w} in the wash.</p>
  <div class="stepper" style="margin-top:8px"><button type="button" data-washstep="-1" aria-label="One fewer in wash">−</button><span>${w} in wash</span><button type="button" data-washstep="1" aria-label="One more in wash">+</button></div>`;
}

function syncText(){
  const d=ui.draft;if(!d)return;
  const g=id=>$("#"+id);
  if(g("f-desc"))d.desc=g("f-desc").value;
  if(g("f-name"))d.nameInput=g("f-name").value.trim();
  if(g("f-brand"))d.brand=g("f-brand").value.trim();
  if(g("f-price")){const p=parseFloat(g("f-price").value.replace(",","."));d.price=isFinite(p)&&p>=0?Math.round(p*100)/100:""}
  if(g("f-nolayer"))d.noLayer=g("f-nolayer").checked;
}
function rerenderSheet(){const b=$("#dlgBody");const y=b.scrollTop;syncText();renderSheet();b.scrollTop=y}
function sheetNext(){
  const i=ui.queue.indexOf(ui.draftId);const nid=ui.queue[i+1];
  if(ui.inQueue&&nid)openItem(nid,true);
  else{$("#dlg").close();ui.queue=[];ui.draft=null;render()}
}
async function sheetSave(){
  syncText();const d=ui.draft,cat=d.category;
  const miss=[!cat&&"category",cat&&NEEDS_TYPE.has(cat)&&!d.type&&"type",!d.color&&"main colour",cat&&!NO_OCCASION.has(cat)&&!(d.formality||[]).length&&"occasion",cat&&NEEDS_WARMTH.has(cat)&&d.warmth==null&&"warmth"].filter(Boolean);
  if(miss.length){const e=$("#d-err");e.textContent="Still needed: "+miss.join(", ")+".";e.hidden=false;e.scrollIntoView({block:"center"});return}
  const keep=new Set([...(LAYOUT[cat]||[]),"color","type","warmth","formality","season","brand","desc","noLayer","qty","status","inWash","price","wearsPerWash","washedAt"]);
  const clean={v:3,photo:d.photo,addedAt:d.addedAt,category:cat};
  for(const k of keep)if(d[k]!==undefined&&d[k]!==null&&d[k]!==""&&!(Array.isArray(d[k])&&!d[k].length&&MULTI_FIELDS.includes(k)))clean[k]=d[k];
  if(clean.colors2)clean.colors2=clean.colors2.filter(c=>c!==clean.color);
  if(!NEEDS_WARMTH.has(cat))delete clean.warmth;
  if(cat==="Underlayer")clean.warmth=0;
  const auto=`${d.color} ${(d.type&&d.type!=="Other"&&d.type!=="Dress"?d.type.replace("T-shirt / top","top"):cat)}`.toLowerCase().replace(" / "," ");
  const typed=d.nameInput;
  clean.name=typed&&typed!==auto?typed:auto;
  clean.autoName=auto;clean.needsTags=false;clean.needsReview=false;
  clean.inWash=Math.min(clean.qty||1,Math.max(0,d.inWash||0));
  if(d.status==="At tailor"){clean.status="At tailor";clean.inWash=0}else{clean.status=clean.inWash>=(clean.qty||1)?"In laundry":"In closet"}
  const prev=S.items.get(ui.draftId);if(prev&&(prev.inWash||0)>clean.inWash)clean.washedAt=today();
  try{await Store.put("items",ui.draftId,clean)}catch(e){return}
  if(ui.inQueue)sheetNext();else{$("#dlg").close();ui.draft=null;render();toast("Saved")}
}
$("#dlgBody").addEventListener("input",e=>{if(["f-name","f-brand","f-desc","f-price"].includes(e.target.id))syncText()});
$("#dlgBody").addEventListener("click",async e=>{
  if(ui.slot){
    const pick=e.target.closest("[data-slotpick]"),sc=e.target.closest("[data-slotcat]"),sa=e.target.closest("[data-slot]");
    if(pick){applySlot(pick.dataset.slotpick);return}
    if(sc){ui.slot.addCat=sc.dataset.slotcat;renderSlot();return}
    if(sa&&sa.dataset.slot==="remove"){applySlot(null);return}
    if(sa&&sa.dataset.slot==="close"){ui.slot=null;$("#dlg").close();return}
    return;
  }
  if(ui.bulk){bulkClick(e);return}
  const d=ui.draft;if(!d)return;
  const f=e.target.closest("[data-f]"),m=e.target.closest("[data-m]"),a=e.target.closest("[data-sheet]");
  if(f){
    const k=f.dataset.f;let v=f.dataset.v;if(k==="warmth")v=+v;
    if(k==="category"){if(d.category!==v){d.category=v;d.type=""}rerenderSheet();return}
    d[k]=(d[k]===v&&k!=="status")?"":v;
    f.parentElement.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",String(x===f&&d[k]!=="")));
    return;
  }
  const wp=e.target.closest("[data-wp]");
  if(wp){const v=wp.dataset.wp;d.wearsPerWash=v===""?"":+v;wp.parentElement.querySelectorAll("[data-wp]").forEach(x=>x.setAttribute("aria-pressed",String(x===wp)));return}
  const w1=e.target.closest("[data-wash1]"),ws=e.target.closest("[data-washstep]"),tl=e.target.closest("[data-tailor]");
  if(w1){const prevW=d.inWash||0;d.inWash=(w1.dataset.wash1==="In laundry")?1:0;if((d.inWash||0)<prevW)d.washedAt=today();d.status=d.inWash?"In laundry":"In closet";rerenderSheet();return}
  if(ws){const q=qtyOf(d);const prevW=d.inWash||0;d.inWash=Math.max(0,Math.min(q,prevW+ +ws.dataset.washstep));if(d.inWash<prevW)d.washedAt=today();d.status=d.inWash>=q?"In laundry":"In closet";rerenderSheet();return}
  if(tl){d.status=d.status==="At tailor"?"In closet":"At tailor";if(d.status==="At tailor")d.inWash=0;rerenderSheet();return}
  if(m){const k=m.dataset.m,v=m.dataset.v;const cur=arr(d[k]);d[k]=cur.includes(v)?cur.filter(x=>x!==v):[...cur,v];m.setAttribute("aria-pressed",String(d[k].includes(v)));return}
  if(!a)return;
  const act=a.dataset.sheet;
  if(act==="fill"){
    syncText();const text=d.desc||"";if(!text.trim()){toast("Paste a description first");return}
    const n=applyParsed(d,parseDesc(text));rerenderSheet();toast(n?`Filled ${n} ${n===1?"tag":"tags"}. Check them below.`:"Nothing new found in that text");
  }
  if(act==="photo"){syncText();$("#photoIn").click();return}
  if(act==="dup"){
    const src=S.items.get(ui.draftId);if(!src)return;
    const nid=rid();
    const copy={...src,color:"",colors2:[],name:"",autoName:"",addedAt:Date.now(),needsTags:true,needsReview:false,status:"In closet"};
    delete copy.id;
    await Store.put("items",nid,copy);render();
    openItem(nid,false);toast("Copy made. Change its photo and pick its colour.");return;
  }
  if(act==="qm"){d.qty=Math.max(1,(d.qty||1)-1);$("#qtyv").textContent=d.qty}
  if(act==="qp"){d.qty=Math.min(20,(d.qty||1)+1);$("#qtyv").textContent=d.qty}
  if(act==="save")sheetSave();
  if(act==="skip")sheetNext();
  if(act==="close"){$("#dlg").close();ui.queue=[];ui.draft=null;render()}
  if(act==="style"){ui.anchor=ui.draftId;ui.tab="ideas";ui.mode="quick";ui.results=[];ui.err="";$("#dlg").close();ui.draft=null;render();scrollTo(0,0)}
  if(act==="del"){
    if(!a.dataset.armed){a.dataset.armed="1";a.textContent="Tap again to delete";return}
    const id=ui.draftId;ui.sel.delete(id);if(ui.anchor===id)ui.anchor=null;
    await Store.remove("items",id);toast("Piece deleted");
    if(ui.inQueue){const i=ui.queue.indexOf(id);ui.queue.splice(i,1);const nid=ui.queue[i];if(nid){openItem(nid,true);return}}
    $("#dlg").close();ui.queue=[];ui.draft=null;render();

function addStop(){
  const t=ui.newTrip;if(!t.pick)return;
  if(!t.from||!t.to||t.to<t.from){toast("Check the dates for this stop");return}
  t.stops.push({...t.pick,from:t.from,to:t.to});t.stops.sort((a,b)=>a.from.localeCompare(b.from));
  const nx=new Date(dayMs(t.to));const nx2=new Date(dayMs(t.to)+3*864e5);
  t.pick=null;t.q="";t.results=[];t.from=ymd(nx);t.to=ymd(nx2);render();
}
async function createTrip(){
  const t=ui.newTrip;
  if(t.pick&&!t.stops.length)addStop();
  if(!t.stops.length){toast("Add at least one stop");return}
  const start=t.stops.reduce((m,s)=>s.from<m?s.from:m,t.stops[0].from),end=t.stops.reduce((m,s)=>s.to>m?s.to:m,t.stops[0].to);
  const dates=[];for(let d=dayMs(start);d<=dayMs(end);d+=864e5)dates.push(ymd(new Date(d)));
  if(dates.length>45){toast("Trips can be up to 45 days");return}
  if(!t.occ.length){toast("Pick at least one occasion");return}
  const stops=t.stops.map(s=>({name:s.name,label:s.label,lat:s.lat,lon:s.lon,from:s.from,to:s.to}));
  const days=dates.map((date,i)=>{
    let stop=stops.findIndex(s=>s.from<=date&&s.to>=date);if(stop<0){stop=0;for(let k=0;k<stops.length;k++)if(stops[k].from<=date)stop=k}
    let travel=null;
    const next=stops.findIndex((s,k)=>k>stop&&s.from===date);
    if(t.fromHome&&i===0)travel={from:"home",to:stop};
    else if(t.fromHome&&i===dates.length-1)travel={from:stops.length-1,to:"home"};
    else if(next>0&&stops[stop].to===date)travel={from:stop,to:next};
    return {date,stop:travel&&travel.to!=="home"?travel.to:stop,travel,occasions:travel?["Travel"]:[...t.occ],laundry:false};
  });
  const id=rid();
  const trip={id,name:t.name.trim()||stops.map(s=>s.name).join(" and "),stops,days,start,end,carryOn:t.carryOn,fallback:t.fallback,createdAt:Date.now(),packed:{},checks:{},outfits:{},built:false};
  ui.newTrip=null;ui.tripId=id;
  await Store.put("trips",id,trip);render();scrollTo(0,0);
  refreshTripWeather(trip,true);
}

/* ---- weather for stops, home and travel days ---- */
async function fetchHourly(lat,lon,start,end){
  const startOff=Math.round((dayMs(start)-dayMs(today()))/864e5);
  if(startOff<=15&&dayMs(end)>=dayMs(today())){
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${(+lat).toFixed(3)}&longitude=${(+lon).toFixed(3)}&hourly=apparent_temperature,precipitation_probability&timezone=auto&forecast_days=16`);
    const j=await r.json();return j.hourly?{at:Date.now(),data:j.hourly,kind:"forecast"}:null;
  }
  const shift=d=>(+d.slice(0,4)-1)+d.slice(4);
  const r=await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${(+lat).toFixed(3)}&longitude=${(+lon).toFixed(3)}&start_date=${shift(start)}&end_date=${shift(end)}&hourly=apparent_temperature,precipitation&timezone=auto`);
  const j=await r.json();if(!j.hourly)return null;j.hourly.shift=1;return {at:Date.now(),data:j.hourly,kind:"history"};
}
async function refreshTripWeather(trip,force){
  if(!trip)return;
  if(navigator.onLine){
    const stale=x=>!x||force||Date.now()-x.at>6*36e5||(x.kind==="history"&&Math.round((dayMs(trip.start)-dayMs(today()))/864e5)<=15);
    for(const s of trip.stops){if(stale(s.fc)){try{s.fc=await fetchHourly(s.lat,s.lon,s.from,s.to)||s.fc}catch(e){}}}
    const home=JSON.parse(lsGet("closet-home")||"null");
    if(home&&trip.days.some(d=>d.travel&&(d.travel.from==="home"||d.travel.to==="home"))&&stale(trip.homeFc)){
      try{trip.homeFc=await fetchHourly(home.lat,home.lon,trip.start,trip.end)||trip.homeFc}catch(e){}
    }
  }
  await Store.put("trips",trip.id,trip);if(ui.tripId===trip.id)render();
}
function placeWeather(trip,p,date){
  if(p==="home")return forecastFor(trip.homeFc&&trip.homeFc.data,date)||forecastFor(FC.data,date);
  const s=trip.stops[p];return s&&s.fc?forecastFor(s.fc.data,date):null;
}
function tripDayWeather(trip,day){
  const places=day.travel?[day.travel.from,day.travel.to]:[day.stop];
  const fs=places.map(p=>placeWeather(trip,p,day.date)).filter(Boolean);
  if(!fs.length)return {weather:trip.fallback||"Mild",rain:false,f:null,src:"expected"};
  const cold=fs.reduce((a,b)=>b.feels<a.feels?b:a);
  return {weather:cold.weather,rain:fs.some(x=>x.wet),f:cold,src:fs.some(x=>x.hist)?"last year":"forecast"};
}

/* ---- wear limits ---- */
function defaultWears(it){
  switch(it.category){
    case "Top":case "Dress":case "Legwear":case "Underlayer":return 1;
    case "Bottom":return 2;
    case "Outerwear":return it.type==="Cardigan"?2:Infinity;
    case "Swimwear":return 2;
    case "Sleepwear":return 3;
    default:return Infinity;
  }
}
function wearLimit(it){const v=it.wearsPerWash;if(v===-1)return Infinity;if(+v>0)return +v;return defaultWears(it)}
function capacity(it){return wearLimit(it)*(it.qty||1)}
function isSportBra(i){return i.type==="Sports top"&&i.sleeves&&SLEEVE_RANK[i.sleeves]<=2}
function isSportOverTop(i){return i.type==="Sports top"&&i.sleeves&&SLEEVE_RANK[i.sleeves]>=3}
function sportUnderOptions(pool,over){
  // things that can sit under a sports top: a sports bra, a tank/cami, a plain fitted tee
  return pool.filter(u=>u.id!==over.id&&!u.needsTags&&available(u)&&(
    isSportBra(u)||u.type==="Tank / cami"||(u.type==="T-shirt / top"&&["Tight","Fitted"].includes(u.fit)&&SLEEVE_RANK[u.sleeves]<=SLEEVE_RANK[over.sleeves])
  ));
}
function bareUnder(o){
  const tops=o.filter(i=>i.category==="Top"||i.category==="Dress");
  if(!tops.length)return false;
  return Math.max(...tops.map(i=>i.sleeves?SLEEVE_RANK[i.sleeves]:99))<=2;
}
function recordUses(uses,o){
  const bare=bareUnder(o);
  for(const i of o){
    const lim=wearLimit(i);if(!isFinite(lim))continue;
    if(i.category==="Outerwear"&&MID.has(i.type)&&bare)uses.set(i.id,capacity(i));
    else uses.set(i.id,(uses.get(i.id)||0)+1);
  }
}

/* ---- building outfits ---- */
function withBrief(b,fn){
  const keys=["occasion","weather","rain","anchor","neglect","packBoost","extraExclude","tripMode","avoidMain","tripUses","carry","travelDay"];const save={};
  keys.forEach(k=>save[k]=ui[k]);Object.assign(ui,b);
  try{return fn()}finally{keys.forEach(k=>ui[k]=save[k])}
}
function pickTripOutfit(trip,day,occ,ctx,avoid){
  const w=tripDayWeather(trip,day);
  const brief={occasion:occ,weather:w.weather,rain:w.rain,anchor:null,neglect:false,packBoost:ctx.boost,extraExclude:ctx.exclude,tripMode:true,avoidMain:avoid||null,tripUses:ctx.uses,carry:trip.carryOn?ctx.carry:null,travelDay:occ==="Travel"||!!day.travel};
  const r=withBrief(brief,()=>suggest());
  if(r[0])return {pick:r[0],w};
  const loose=withBrief({...brief,tripUses:null},()=>suggest());
  return {pick:null,w,short:!!loose[0]};
}
function noteUse(ctx,o){
  recordUses(ctx.uses,o);
  for(const i of o){ctx.boost.set(i.id,(ctx.boost.get(i.id)||0)+1);
    if(i.category==="Shoes")ctx.carry.shoes.add(i.id);if(i.category==="Outerwear"&&!MID.has(i.type))ctx.carry.outer.add(i.id);if(i.category==="Bag")ctx.carry.bags.add(i.id)}
  ctx.exclude.add(sig(o.map(i=>i.id)));
}
function buildTrip(trip,onlyDate){
  const ctx={uses:new Map(),boost:new Map(),exclude:new Set(),carry:{shoes:new Set(),outer:new Set(),bags:new Set()}};
  const out={};
  for(const day of trip.days){
    const keep=onlyDate&&day.date!==onlyDate&&trip.outfits&&trip.outfits[day.date];
    if(keep){
      out[day.date]=trip.outfits[day.date];
      for(const o of out[day.date])if(o.itemIds.length)noteUse(ctx,o.itemIds.map(id=>S.items.get(id)).filter(Boolean));
    }else{
      out[day.date]=day.occasions.map(occ=>{
        const {pick,w,short}=pickTripOutfit(trip,day,occ,ctx);
        if(!pick)return {occasion:occ,itemIds:[],short,why:short?`Not enough fresh pieces left for ${occ.toLowerCase()} by this day. Add a laundry day earlier, or tag more pieces for it.`:occasionGap(occ,w.weather),weather:w.weather,rain:w.rain};
        noteUse(ctx,pick.itemIds.map(id=>S.items.get(id)).filter(Boolean));
        return {occasion:occ,itemIds:pick.itemIds,why:pick.why,tips:pick.tips,weather:w.weather,rain:w.rain};
      });
    }
    if(day.laundry)ctx.uses.clear();
  }
  trip.outfits=out;trip.built=true;
}
function swapTripOutfit(trip,date,i){
  const ctx={uses:new Map(),boost:new Map(),exclude:new Set(),carry:{shoes:new Set(),outer:new Set(),bags:new Set()}};
  let target=null;
  for(const day of trip.days){
    (trip.outfits[day.date]||[]).forEach((o,j)=>{
      if(o.itemIds.length)ctx.exclude.add(sig(o.itemIds));
      if(day.date===date&&j===i){target=day;return}
      if(o.itemIds.length)noteUse(ctx,o.itemIds.map(id=>S.items.get(id)).filter(Boolean));
    });
    if(day.laundry&&day.date<date)ctx.uses.clear();
  }
  (trip.swapped=trip.swapped||[]).forEach(s=>ctx.exclude.add(s));
  const cur=trip.outfits[date][i];if(cur.itemIds.length)trip.swapped.push(sig(cur.itemIds));
  const {pick,w}=pickTripOutfit(trip,target,cur.occasion,ctx,new Set(cur.itemIds));
  if(pick)trip.outfits[date][i]={occasion:cur.occasion,itemIds:pick.itemIds,why:pick.why,tips:pick.tips,weather:w.weather,rain:w.rain};
  else toast("No other combination fits. Try changing that day's occasions.");
}

/* ---- packing ---- */
function packList(trip){
  const count=new Map();
  for(const list of Object.values(trip.outfits||{}))for(const o of list)for(const id of o.itemIds)count.set(id,(count.get(id)||0)+1);
  return [...count.entries()].map(([id,n])=>({it:S.items.get(id),n})).filter(x=>x.it)
    .sort((a,b)=>(ORDER[a.it.category]??9)-(ORDER[b.it.category]??9)||(a.it.name||"").localeCompare(b.it.name||""));
}
function packExtras(trip){
  const n=trip.days.length,nights=Math.max(0,n-1);const out=[];
  out.push({key:"underwear",label:`Underwear × ${n+1}`,hint:"one per day plus a spare"});
  let socks=0;
  for(const d of trip.days){const list=trip.outfits[d.date]||[];
    if(list.some(o=>{const its=o.itemIds.map(id=>S.items.get(id)).filter(Boolean);return its.some(i=>i.category==="Shoes"&&i.toe!=="Open"&&i.type!=="Sandals")&&!its.some(i=>i.category==="Legwear")}))socks++}
  if(socks)out.push({key:"socks",label:`Socks × ${socks}`,hint:"for days with closed shoes"});
  if(nights){
    const w=wearStats();const sleep=items().filter(i=>i.category==="Sleepwear"&&!i.needsTags).sort((a,b)=>(w.get(a.id)?.count||0)-(w.get(b.id)?.count||0));
    const need=Math.max(1,Math.ceil(nights/3));
    if(sleep.length)sleep.slice(0,need).forEach(i=>out.push({key:"sleep:"+i.id,label:i.name,item:i,hint:"sleepwear"}));
    else out.push({key:"sleepwear",label:`Sleepwear × ${need}`,hint:`for ${nights} ${nights===1?"night":"nights"}`});
  }
  return out;
}

/* ---- trip view ---- */

    h+=`<article class="card"><div class="dayhead"><h3>${esc(new Date(dayMs(day.date)).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}))}, ${esc(where)}</h3>

    <div class="chips wrap" style="padding-top:0">${OCCASIONS.map(o=>`<button class="chip" data-act="t-dayocc" data-d="${day.date}" data-v="${esc(o)}" aria-pressed="${day.occasions.includes(o)}">${esc(o)}</button>`).join("")}</div>

/* ================= stats ================= */
function renderStats(){
  const w=wearStats();const all=items().filter(i=>!i.needsTags);
  let h=`<h1>Stats</h1><!--/head-->`;
  if(!all.length)return h+`<p class="sub">Tag some pieces and log a few outfits, and your stats show up here.</p>`;
  const pieces=all.reduce((n,i)=>n+(i.qty||1),0);
  const cut=Date.now()-30*864e5;const worn30=new Set();
  S.log.forEach(e=>{if(dayMs(e.date)>=cut)(e.itemIds||[]).forEach(id=>worn30.add(id))});
  const pct=Math.round(100*all.filter(i=>worn30.has(i.id)).length/all.length);
  h+=`<div class="statgrid">
    <div class="stat"><b>${pieces}</b><span>pieces</span></div>
    <div class="stat"><b>${S.log.size}</b><span>days logged</span></div>
    <div class="stat"><b>${pct}%</b><span>of your closet worn in the last 30 days</span></div></div>`;
  const most=all.filter(i=>w.get(i.id)).sort((a,b)=>w.get(b.id).count-w.get(a.id).count).slice(0,5);
  if(most.length){h+=`<h2>Most worn</h2>`;most.forEach(i=>h+=statRow(i,`${w.get(i.id).count}x, last ${ago(w.get(i.id).last)}`))}
  const never=all.filter(i=>!w.get(i.id));
  if(never.length)h+=`<h2>Never worn yet</h2><p class="sub">${never.length} ${never.length===1?"piece hasn't":"pieces haven't"} been logged yet. <button class="linkbtn" data-act="goto-filter" data-v="Never worn">Show them</button></p>`;
  const priced=all.filter(i=>+i.price>0);
  if(priced.length){
    const total=priced.reduce((s,i)=>s+(+i.price)*(i.qty||1),0);
    const cpw=i=>(+i.price)/Math.max(1,(w.get(i.id)?.count||0));
    h+=`<h2>Cost per wear</h2><p class="sub">${priced.length} priced ${priced.length===1?"piece":"pieces"}, €${Math.round(total).toLocaleString()} in total.</p>`;
    const best=priced.filter(i=>w.get(i.id)).sort((a,b)=>cpw(a)-cpw(b)).slice(0,3);
    if(best.length){h+=`<p class="packcat">Best value</p>`;best.forEach(i=>h+=statRow(i,`€${cpw(i).toFixed(2)} per wear, worn ${w.get(i.id).count}x`))}
    const worst=[...priced].sort((a,b)=>cpw(b)-cpw(a)).slice(0,3);
    h+=`<p class="packcat">Wear these more</p>`;worst.forEach(i=>h+=statRow(i,`€${cpw(i).toFixed(2)} per wear, worn ${w.get(i.id)?.count||0}x`));
  }else h+=`<h2>Cost per wear</h2><p class="sub">Add what you paid to a piece (under Extras) to see its cost per wear.</p>`;
  const gaps=findGaps(all);
  h+=`<h2>Gaps</h2>`+(gaps.length?`<ul class="tips">${gaps.map(g=>`<li>${esc(g)}</li>`).join("")}</ul>`:`<p class="sub">No obvious gaps. Nice.</p>`);
  h+=`<h2>By category</h2><div class="statgrid">${CATS.filter(c=>all.some(i=>i.category===c)).map(c=>`<div class="stat"><b>${all.filter(i=>i.category===c).reduce((n,i)=>n+(i.qty||1),0)}</b><span>${esc(c)}</span></div>`).join("")}</div>`;
  return h;
}
function statRow(i,txt){return `<div class="packrow static"><img src="${i.photo}" alt=""><span class="nm">${esc(i.name)}<small>${esc(txt)}</small></span></div>`}
function findGaps(all){
  const g=[];const outer=all.filter(i=>i.category==="Outerwear");
  if(!outer.some(i=>i.rainproof==="Yes"&&!MID.has(i.type)))g.push("No rainproof jacket or trench tagged, so rainy days can't get a proper outer layer.");
  if(!outer.some(i=>!MID.has(i.type)&&W(i)>=3))g.push("No warm coat (warmth: Warm) for cold days.");
  if(!outer.some(i=>MID.has(i.type)))g.push("No cardigan, blazer or gilet, which bare arms in mild weather rely on.");
  if(all.some(i=>i.sheer==="Sheer"||i.sheer==="Semi-sheer")&&!all.some(i=>i.category==="Underlayer"))g.push("You have sheer pieces but no underlayers (slip, bike shorts, camisole) tagged.");
  if(all.some(i=>i.category==="Dress"||(i.category==="Bottom"&&i.type==="Skirt"))&&!all.some(i=>i.category==="Legwear"&&i.type==="Tights"))g.push("No tights tagged, so dresses and skirts can't be styled for cold days.");
  for(const occ of OCCASIONS){
    const t=all.filter(i=>(i.formality||[]).includes(occ));if(t.length<3)continue;
    const hasBase=t.some(i=>i.category==="Dress")||(t.some(i=>i.category==="Top")&&t.some(i=>i.category==="Bottom"));
    if(!hasBase)g.push(`${occ}: no complete base yet (a top and a bottom, or a dress).`);
    if(!t.some(i=>i.category==="Shoes"))g.push(`${occ}: no shoes tagged for it.`);
  }
  const miss=all.filter(missingDetails).length;
  if(miss)g.push(`${miss} ${miss===1?"piece is":"pieces are"} missing details like sleeves or fit, which the layering rules need.`);
  return g;
}


/* ================= edit a suggested outfit ================= */
function slotCategory(it){return it.category}
function candidatesFor(outfit,slotId,ctx){
  const cur=S.items.get(slotId);if(!cur)return [];
  const cat=cur.category;const w=wearStats();
  const others=outfit.itemIds.filter(id=>id!==slotId).map(id=>S.items.get(id)).filter(Boolean);
  const occ=ctx.occasion||ui.occasion,wea=ctx.weather||ui.weather,rain=ctx.rain!=null?ctx.rain:ui.rain;
  const fitsO=i=>NO_OCCASION.has(i.category)||occ==="Any"||(i.formality||[]).includes(occ);
  return items().filter(i=>!i.needsTags&&available(i)&&i.category===cat&&i.id!==slotId&&i.type!=="Sleepwear")
    .filter(i=>fitsO(i))
    .map(i=>{
      let s=0;const combo=[...others,i];
      // colour harmony with the rest
      if(typeof colourOK==="function"&&!colourOK(combo.filter(x=>MAIN.has(x.category)||x.category==="Swimwear")))s-=3;
      const neg=isNeglected(i,w.get(i.id));if(neg)s+=1;
      if(w.get(i.id))s-=0; else s+=.5;
      // weather suitability
      const season=i.season&&i.season.length&&!WEATHER_SEASON[wea].some(ss=>i.season.includes(ss));
      if(season)s-=4;
      s+=Math.random()*.3;
      return {i,s,warn:season?"different season":""};
    }).sort((a,b)=>b.s-a.s);
}
function addableCategories(outfit){
  const have=new Set(outfit.itemIds.map(id=>S.items.get(id)).filter(Boolean).map(i=>i.category));
  const opts=[];
  if(!have.has("Dress")){if(!have.has("Top"))opts.push("Top");if(!have.has("Bottom"))opts.push("Bottom");}
  if(!have.has("Top")&&!have.has("Bottom")&&!have.has("Dress"))opts.push("Dress");
  for(const c of ["Outerwear","Shoes","Legwear","Bag","Accessory","Underlayer"])if(!have.has(c))opts.push(c);
  return opts.filter(c=>items().some(i=>!i.needsTags&&available(i)&&i.category===c));
}

  const r=resultAt(ref);
  if(r&&r.trip){const day=r.trip.days.find(d=>d.date===r.date);const w=day?tripDayWeather(r.trip,day):null;const o=r.list[r.i];return {occasion:o.occasion,weather:w?w.weather:ui.weather,rain:w?w.rain:false}}

    case "s-wear":{const ids=[...ui.sel];const o=findOutfit(ids);await wearToday(ids,o&&o.id);ui.sel.clear();ui.selecting=false;render();break}
    case "s-save":{const ids=[...ui.sel];if(ids.length<2){toast("Pick at least 2 pieces for an outfit");break}
      const ex=findOutfit(ids);await saveOutfit(ids);toast(ex?"You already saved this outfit":"Outfit saved");ui.sel.clear();ui.selecting=false;render();break}
    case "s-edit":openBulk();break;
    case "p-choose":startPlanning(v);break;
    case "p-cancel":ui.planDate=null;render();break;
    case "p-clear":await Store.remove("plans",v);render();break;
    case "p-wear":{const p=S.plans.get(v);if(p){const ex=findOutfit(p.itemIds);await wearToday(p.itemIds,ex&&ex.id)}render();break}
    case "r-plan":{const r=resultAt(el.dataset.ref);const o=r&&r.list[r.i];if(o)await planOutfit(o.itemIds,o.title,o.why);break}
    case "o-plan":{const o=S.outfits.get(id);if(o)await planOutfit(o.itemIds,o.title,o.why);break}
    case "t-new":ui.newTrip=newTripState();ui.editList=false;render();scrollTo(0,0);break;
    case "t-back":ui.newTrip=null;ui.tripId=null;ui.editList=false;render();scrollTo(0,0);break;
    case "t-search":searchPlace();break;
    case "t-place":ui.newTrip.pick=ui.newTrip.results[+v];ui.newTrip.results=[];render();break;
    case "t-addstop":addStop();break;
    case "t-rmstop":ui.newTrip.stops.splice(+v,1);render();break;
    case "t-occ":{const a=ui.newTrip.occ;ui.newTrip.occ=a.includes(v)?a.filter(x=>x!==v):[...a,v];render();break}
    case "t-fb":{ui.newTrip.fallback=v;render();break}
    case "t-create":createTrip();break;
    case "t-open":{const t=S.trips.get(id);ui.tripId=id;ui.editList=false;render();scrollTo(0,0);refreshTripWeather(t,false);break}
    case "t-carry":{const t=S.trips.get(ui.tripId);if(t){t.carryOn=!t.carryOn;if(t.built)buildTrip(t);await Store.put("trips",t.id,t);render()}break}
    case "t-dayocc":{const t=S.trips.get(ui.tripId);if(!t)break;const day=t.days.find(d=>d.date===el.dataset.d);if(!day)break;
      day.occasions=day.occasions.includes(v)?day.occasions.filter(x=>x!==v):[...day.occasions,v];
      if(t.built)buildTrip(t,day.date);await Store.put("trips",t.id,t);render();break}
    case "t-travel":{const t=S.trips.get(ui.tripId);if(!t)break;const day=t.days.find(d=>d.date===el.dataset.d);if(!day)break;
      if(day.travel){day.travel=null;day.occasions=day.occasions.filter(o=>o!=="Travel");if(!day.occasions.length)day.occasions=["Casual"]}
      else{const i=t.days.indexOf(day);const prev=i>0?(t.days[i-1].travel?t.days[i-1].travel.to:t.days[i-1].stop):"home";day.travel={from:prev,to:day.stop};if(!day.occasions.includes("Travel"))day.occasions=["Travel",...day.occasions]}
      if(t.built)buildTrip(t,day.date);await Store.put("trips",t.id,t);render();break}
    case "t-laundry":{const t=S.trips.get(ui.tripId);if(!t)break;const day=t.days.find(d=>d.date===el.dataset.d);if(!day)break;day.laundry=!day.laundry;if(t.built)buildTrip(t);await Store.put("trips",t.id,t);render();break}
    case "t-build":{const t=S.trips.get(ui.tripId);if(t){buildTrip(t);await Store.put("trips",t.id,t);render();toast("Outfits built for every day")}break}
    case "t-swap":{const t=S.trips.get(ui.tripId);if(t){swapTripOutfit(t,el.dataset.d,+el.dataset.i);await Store.put("trips",t.id,t);render()}break}
    case "t-pack":{const t=S.trips.get(ui.tripId);if(t){t.packed=t.packed||{};t.packed[id]=!t.packed[id];await Store.put("trips",t.id,t);render()}break}
    case "t-check":{const t=S.trips.get(ui.tripId);if(t){t.checks=t.checks||{};t.checks[v]=!t.checks[v];await Store.put("trips",t.id,t);render()}break}
    case "t-editlist":ui.editList=!ui.editList;render();break;
    case "t-addcheck":{const inp=$("#t-newcheck");const x=inp&&inp.value.trim();if(!x)break;const list=[...getChecklist()];if(!list.includes(x))list.push(x);await Store.put("meta","checklist",{items:list});render();break}
    case "t-rmcheck":{await Store.put("meta","checklist",{items:getChecklist().filter(x=>x!==v)});render();break}
    case "t-home":{const t=S.trips.get(ui.tripId);if(t)await tripBackHome(t);break}
    case "t-refresh":{const t=S.trips.get(ui.tripId);toast("Updating the weather…");await refreshTripWeather(t,true);break}
    case "t-del":{if(el.dataset.armed){await Store.remove("trips",ui.tripId);ui.tripId=null;render();toast("Trip deleted")}else{el.dataset.armed="1";el.textContent="Tap again to delete this trip"}break}
    case "t-wear":{const t=S.trips.get(ui.tripId);const o=t&&t.outfits[el.dataset.d]&&t.outfits[el.dataset.d][+el.dataset.i];if(o){const oid=await saveOutfit(o.itemIds,o.occasion+" outfit",o.why);await wearToday(o.itemIds,oid)}render();break}
    case "goto-filter":ui.tab="closet";ui.filter=v;render();scrollTo(0,0);break;
    case "s-laundry":{const ids=[...ui.sel];const allFull=ids.every(i=>{const it=S.items.get(i)||{};return inWash(it)>=qtyOf(it)});
      for(const i of ids){const it=S.items.get(i);if(it)await moveToWash(it,allFull?-qtyOf(it):1)}
      toast(allFull?"Washed and back in your closet":"One of each sent to the wash");ui.sel.clear();ui.selecting=false;render();break}
    case "goto":ui.tab=v;render();break;
    case "mode":ui.mode=v;render();if(v==="quick")loadForecast(false);break;
    case "occ":ui.occasion=v;refreshIfStale();break;
    case "wea":ui.weather=v;ui.weatherManual=true;refreshIfStale();break;
    case "rain":ui.rain=!ui.rain;ui.weatherManual=true;refreshIfStale();break;
    case "fcday":ui.fcOff=+v;ui.weatherManual=false;applyForecast();render();loadForecast(false);break;
    case "usefc":ui.weatherManual=false;applyForecast();render();break;
    case "refreshfc":FC.status="idle";loadForecast(true);break;
    case "unanchor":ui.anchor=null;refreshIfStale();break;
    case "gen":generate();break;
    case "o-slot":openSlot(el.dataset.ref,el.dataset.id);break;
    case "o-add":openAdd(el.dataset.ref);break;
    case "r-save":{const r=resultAt(el.dataset.ref);const o=r&&r.list[r.i];if(!o)break;await saveOutfit(o.itemIds,o.title,o.why);o.saved=true;render();toast("Outfit saved");break}
    case "r-wear":{const r=resultAt(el.dataset.ref);const o=r&&r.list[r.i];if(!o)break;const oid=await saveOutfit(o.itemIds,o.title,o.why);o.saved=true;await wearToday(o.itemIds,oid);render();break}
    case "r-pass":{const r=resultAt(el.dataset.ref);if(!r)break;const o=r.list.splice(r.i,1)[0];render();if(o)await Store.put("passes",rid(),{itemIds:o.itemIds,at:Date.now()}).catch(()=>{});break}
    case "o-wear":{const o=S.outfits.get(id);if(o)await wearToday(o.itemIds,o.id);render();break}
    case "o-del":{if(el.dataset.armed){await Store.remove("outfits",id);toast("Outfit removed");render()}else{el.dataset.armed="1";el.textContent="Tap again to remove"}break}
    case "export":exportBackup();break;
    case "import":$("#restore").click();break;
    case "savekey":{const k=$("#keyIn").value.trim();const m=$("#modelIn").value.trim();
      if(k&&!k.startsWith("••")){if(!k.startsWith("sk-")){toast("That doesn't look like an API key");break}lsSet("closet-api-key",k)}
      if(!lsGet("closet-api-key")){toast("Paste your API key first");break}
      lsSet("closet-model",m&&m!==DEFAULT_MODEL?m:null);ui.editKey=false;render();toast("Saved on this phone");break}
    case "cancelkey":ui.editKey=false;render();break;
    case "removekey":lsSet("closet-api-key",null);ui.editKey=false;render();toast("Key removed");break;
    case "editkey":ui.editKey=true;render();break;
    case "send":{const t=$("#askText").value.trim();if(!t)break;if(!navigator.onLine){ui.askErr="You're offline. Ask AI needs a connection. Quick ideas still work.";render();break}$("#askText").value="";askAI(t);break}
    case "stop":ui.ctl&&ui.ctl.abort();break;
    case "clearchat":ui.chat=[];ui.askErr="";render();break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ui.q=e.target.value;ui.focusQ=true;render()}
  if(ui.newTrip){const t=ui.newTrip,id=e.target.id;if(id==="t-q")t.q=e.target.value;if(id==="t-from")t.from=e.target.value;if(id==="t-to")t.to=e.target.value;if(id==="t-name")t.name=e.target.value}
});
document.addEventListener("keydown",e=>{if(e.target.id==="t-q"&&e.key==="Enter"){e.preventDefault();searchPlace()}if(e.target.id==="t-newcheck"&&e.key==="Enter"){e.preventDefault();const b=$('[data-act="t-addcheck"]');b&&b.click()}});
document.addEventListener("focusout",e=>{if(e.target.id==="q"&&!ui.rendering)ui.focusQ=false});
document.addEventListener("change",e=>{
  if(e.target.id==="sort"){ui.sort=e.target.value;render()}
  if(ui.newTrip){const t=ui.newTrip,id=e.target.id;if(id==="t-home")t.fromHome=e.target.checked;if(id==="t-carry")t.carryOn=e.target.checked;if(id==="t-from")t.from=e.target.value;if(id==="t-to")t.to=e.target.value}
  if(e.target.dataset&&e.target.dataset.tsel){(async()=>{const t=S.trips.get(ui.tripId);if(!t)return;const day=t.days.find(d=>d.date===e.target.dataset.d);if(!day||!day.travel)return;
    const val=e.target.value==="home"?"home":+e.target.value;day.travel[e.target.dataset.tsel]=val;if(day.travel.to!=="home")day.stop=day.travel.to;
    if(t.built)buildTrip(t,day.date);await Store.put("trips",t.id,t);render()})()}
  if(e.target.matches('[data-act="neglect"]'))ui.neglect=e.target.checked;
  if(e.target.id==="file"){const files=[...e.target.files];e.target.value="";addFiles(files)}
  if(e.target.id==="photoIn"){const f=e.target.files[0];e.target.value="";if(f&&ui.draft){resizeImage(f).then(p=>{ui.draft.photo=p;rerenderSheet();toast("Photo changed. Save to keep it.")}).catch(()=>toast("That photo couldn't be read."))}}
  if(e.target.id==="restore"){const f=e.target.files[0];e.target.value="";if(f)importBackup(f)}
});
addEventListener("online",()=>{if(ui.tab==="ideas")render()});
addEventListener("offline",()=>{if(ui.tab==="ideas")render()});

/* ================= start ================= */
(async function init(){
  try{await Store.load()}
  catch(e){$("#app").innerHTML=`<p class="err">This browser blocked storage, so the closet can't open. In Safari, turn off Private Browsing and try again.</p>`;return}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  loadCachedForecast();applyForecast();
  ui.ready=true;render();
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();

</script>
</body>
